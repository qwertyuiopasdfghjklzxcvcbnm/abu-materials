向下", "language": "zh", "index": 149}, {"start": 555.061, "end": 556.668, "text": "新的低点，反转向上", "language": "zh", "index": 150}, {"start": 556.668, "end": 557.938, "text": "新的低点，反转向上", "language": "zh", "index": 151}, {"start": 557.938, "end": 559.399, "text": "新的高点，反转向下", "language": "zh", "index": 152}, {"start": 559.399, "end": 561.121, "text": "新的低点，反转向上", "language": "zh", "index": 153}, {"start": 561.121, "end": 562.841, "text": "新的高点，反转向下", "language": "zh", "index": 154}, {"start": 564.487, "end": 567.675, "text": "如果你看到市场有很多震荡区间的价格行为", "language": "zh", "index": 155}, {"start": 567.676, "end": 570.409, "text": "当它向下突破时不要激动", "language": "zh", "index": 156}, {"start": 571.269, "end": 574.896, "text": "你必须假设向下突破会失败", "language": "zh", "index": 157}, {"start": 574.897, "end": 577.457, "text": "当它向上突破时也不要激动", "language": "zh", "index": 158}, {"start": 577.881, "end": 580.598, "text": "即使像这样，看上去非常强劲", "language": "zh", "index": 159}, {"start": 580.598, "end": 584.924, "text": "大概率突破会失败，至少会稍微回调", "language": "zh", "index": 160}, {"start": 584.924, "end": 587.007, "text": "这里它下跌到一个新的低点", "language": "zh", "index": 161}, {"start": 591.21, "end": 593.276, "text": "交易是很难的", "language": "zh", "index": 162}, {"start": 593.276, "end": 595.549, "text": "我已经交易了30年，仍然不简单", "language": "zh", "index": 163}, {"start": 595.549, "end": 599.17, "text": "但我喜欢交易，我在交易的时候非常平静", "language": "zh", "index": 164}, {"start": 599.402, "end": 603.009, "text": "当交易者刚开始时，很快就会发现他们在亏钱", "language": "zh", "index": 165}, {"start": 603.009, "end": 608.157, "text": "无论他们多么努力地尝试，", "language": "zh", "index": 166}, {"start": 608.157, "end": 611.005, "text": "无论他们学了多少蜡烛图形态，他们都在亏钱", "language": "zh", "index": 167}, {"start": 611.005, "end": 612.848, "text": "所以他们意识到他们缺乏一些东西", "language": "zh", "index": 168}, {"start": 613.354, "end": 614.826, "text": "例如，这里", "language": "zh", "index": 169}, {"start": 615.052, "end": 618.07, "text": "下跌，下跌，但市场继续上涨", "language": "zh", "index": 170}, {"start": 620.166, "end": 623.03, "text": "他们缺乏的东西是：理解背景", "language": "zh", "index": 171}, {"start": 623.031, "end": 625.974, "text": "背景意味着左边的所有K线", "language": "zh", "index": 172}, {"start": 625.975, "end": 629.761, "text": "左边的背景", "language": "zh", "index": 173}, {"start": 629.761, "end": 633.718, "text": "比当前的这根K线重要得多", "language": "zh", "index": 174}, {"start": 634.649, "end": 637.295, "text": "单靠蜡烛图形态是没用的", "language": "zh", "index": 175}, {"start": 637.295, "end": 639.988, "text": "新手交易者刚开始时不断地亏钱", "language": "zh", "index": 176}, {"start": 639.988, "end": 645.132, "text": "因为你不断地押注趋势会反转", "language": "zh", "index": 177}, {"start": 645.133, "end": 649.36, "text": "不断地押注震荡区间会突破", "language": "zh", "index": 178}, {"start": 649.361, "end": 652.144, "text": "而且80%的时间，你是错的", "language": "zh", "index": 179}, {"start": 652.442, "end": 656.386, "text": "最多20%的胜率", "language": "zh", "index": 180}, {"start": 656.386, "end": 659.392, "text": "很难让你稳定盈利", "language": "zh", "index": 181}, {"start": 662.059, "end": 665.807, "text": "在交易者亏了很多钱之后，他们开始寻找帮助", "language": "zh", "index": 182}, {"start": 665.807, "end": 667.986, "text": "他们迫切地想相信任何东西", "language": "zh", "index": 183}, {"start": 667.986, "end": 671.566, "text": "有很多“热心”的人想帮助你", "language": "zh", "index": 184}, {"start": 671.566, "end": 675.094, "text": "但他们中的大部分都不诚实", "language": "zh", "index": 185}, {"start": 675.095, "end": 679.798, "text": "很多人教你蜡烛图形态", "language": "zh", "index": 186}, {"start": 679.799, "end": 683.476, "text": "告诉你，这可以让你成功", "language": "zh", "index": 187}, {"start": 684.018, "end": 685.702, "text": "事实并非如此", "language": "zh", "index": 188}, {"start": 685.703, "end": 687.506, "text": "这里，阳线，反转K线", "language": "zh", "index": 189}, {"start": 687.506, "end": 689.193, "text": "买入吗？不，不要买", "language": "zh", "index": 190}, {"start": 689.194, "end": 690.562, "text": "它的前面是三根更大的阴线", "language": "zh", "index": 191}, {"start": 690.562, "end": 691.734, "text": "记得多看看左边是什么样子", "language": "zh", "index": 192}, {"start": 691.734, "end": 694.986, "text": "市场在下跌，你应该找做空机会", "language": "zh", "index": 193}, {"start": 697.274, "end": 701.084, "text": "价格行为是什么？显然，蜡烛图形态不是答案", "language": "zh", "index": 194}, {"start": 701.368, "end": 703.333, "text": "听一听电视上的职业交易员", "language": "zh", "index": 195}, {"start": 703.333, "end": 705.612, "text": "真正靠交易为生的人", "language": "zh", "index": 196}, {"start": 706.087, "end": 707.23, "text": "听听他们怎么说", "language": "zh", "index": 197}, {"start": 707.23, "end": 709.148, "text": "他们每天都在告诉你什么是重要的", "language": "zh", "index": 198}, {"start": 709.149, "end": 712.443, "text": "但是从来不会提到什么蜡烛图形态", "language": "zh", "index": 199}, {"start": 714.048, "end": 716.643, "text": "那么交易员们谈论的是什么？", "language": "zh", "index": 200}, {"start": 716.643, "end": 719.754, "text": "如果他们不谈论你在网上看到的蜡烛图形态", "language": "zh", "index": 201}, {"start": 719.755, "end": 722.446, "text": "他们在谈论什么？他们是怎么赚钱的？", "language": "zh", "index": 202}, {"start": 724.878, "end": 729.482, "text": "他们谈论的最重要的事情之一是支撑和阻力", "language": "zh", "index": 203}, {"start": 729.764, "end": 731.827, "text": "支撑阻力有很多种形式", "language": "zh", "index": 204}, {"start": 732.133, "end": 733.49, "text": "比如移动平均线", "language": "zh", "index": 205}, {"start": 733.49, "end": 734.606, "text": "通道", "language": "zh", "index": 206}, {"start": 735.194, "end": 737.974, "text": "这是平均价格", "language": "zh", "index": 207}, {"start": 737.98, "end": 740.383, "text": "交易员们对市场回到平均价格后的反应很感兴趣", "language": "zh", "index": 208}, {"start": 740.383, "end": 743.832, "text": "非常强的下降趋势", "language": "zh", "index": 209}, {"start": 743.832, "end": 746.616, "text": "当它反弹到平均价格时 这很可能是过高的定价", "language": "zh", "index": 210}, {"start": 746.616, "end": 748.059, "text": "所以这是交易者做空的机会", "language": "zh", "index": 211}, {"start": 748.57, "end": 750.622, "text": "于是成为了阻力", "language": "zh", "index": 212}, {"start": 750.974, "end": 752.84, "text": "这里，强势上涨", "language": "zh", "index": 213}, {"start": 752.841, "end": 755.083, "text": "回调到过去20根K线， 或者100根K线的平均价格时", "language": "zh", "index": 214}, {"start": 755.083, "end": 758.431, "text": "反转向上", "language": "zh", "index": 215}, {"start": 758.633, "end": 759.733, "text": "这就是支撑", "language": "zh", "index": 216}, {"start": 759.733, "end": 761.191, "text": "他们也看通道", "language": "zh", "index": 217}, {"start": 761.191, "end": 766.72, "text": "这里是一个多头突破后的下降通道， 所以它可能是一个牛旗", "language": "zh", "index": 218}, {"start": 768.118, "end": 771.62, "text": "交易者们也重点关注前期的高点和低点", "language": "zh", "index": 219}, {"start": 772.876, "end": 775.402, "text": "之前涨到这个高点，然后下跌（阻力）", "language": "zh", "index": 220}, {"start": 775.944, "end": 781.453, "text": "强势突破之后，回调重新测试了这个高点， 阻力变成支撑了", "language": "zh", "index": 221}, {"start": 781.453, "end": 782.831, "text": "然后再次上涨", "language": "zh", "index": 222}, {"start": 782.831, "end": 785.604, "text": "跌破了这个位置，试图再次突破，失败了", "language": "zh", "index": 223}, {"start": 785.604, "end": 787.533, "text": "试图再次向上突破，失败", "language": "zh", "index": 224}, {"start": 787.534, "end": 793.061, "text": "那个高点一开始是是阻力，然后是支撑， 然后又是阻力", "language": "zh", "index": 225}, {"start": 793.061, "end": 795.832, "text": "这个低点，市场强势跌破了它", "language": "zh", "index": 226}, {"start": 795.832, "end": 797.622, "text": "反弹，回测，无法继续向上", "language": "zh", "index": 227}, {"start": 797.622, "end": 798.616, "text": "那里有阻力", "language": "zh", "index": 228}, {"start": 798.616, "end": 800.612, "text": "试图再次突破，遇到了阻力", "language": "zh", "index": 229}, {"start": 800.612, "end": 802.781, "text": "试图再次突破，还是有阻力", "language": "zh", "index": 230}, {"start": 805.326, "end": 810.065, "text": "职业交易员谈论的另一件事是趋势的强度", "language": "zh", "index": 231}, {"start": 810.338, "end": 815.481, "text": "例如，如果市场处于上涨趋势， 你想看到低点抬高", "language": "zh", "index": 232}, {"start": 816.112, "end": 818.088, "text": "高点也抬高", "language": "zh", "index": 233}, {"start": 818.088, "end": 823.979, "text": "如果你看到这些，交易者们更倾向于做多 以任何理由买入做多", "language": "zh", "index": 234}, {"start": 824.661, "end": 830.286, "text": "在下降趋势中，他们看到高点降低 地点也降低", "language": "zh", "index": 235}, {"start": 830.3, "end": 832.323, "text": "既然市场在下跌，他们更倾向于做空", "language": "zh", "index": 236}, {"start": 832.323, "end": 835.089, "text": "不断地卖出，直到有明确的反转向上", "language": "zh", "index": 237}, {"start": 835.089, "end": 838.617, "text": "这里，一个下降趋势，强劲的多头突破", "language": "zh", "index": 238}, {"start": 838.618, "end": 842.761, "text": "低点抬高，是一个大反转的模式", "language": "zh", "index": 239}, {"start": 842.762, "end": 844.704, "text": "反转形成上涨趋势", "language": "zh", "index": 240}, {"start": 849.199, "end": 851.201, "text": "下降通道，下降趋势", "language": "zh", "index": 241}, {"start": 851.201, "end": 853.331, "text": "上涨通道，上涨趋势", "language": "zh", "index": 242}, {"start": 857.186, "end": 861.829, "text": "有两个非常重要的力量，它们控制着所有市场", "language": "zh", "index": 243}, {"start": 861.829, "end": 864.104, "text": "首先是背景和动能", "language": "zh", "index": 244}, {"start": 865.378, "end": 869.278, "text": "我之前说过，背景意味着左边的所有K线", "language": "zh", "index": 245}, {"start": 869.279, "end": 872.873, "text": "支撑和阻力在哪里？", "language": "zh", "index": 246}, {"start": 872.873, "end": 875.761, "text": "我在支撑和阻力的视频中具体讲解了这部分", "language": "zh", "index": 247}, {"start": 878.019, "end": 882.985, "text": "例如，市场在下跌，如果你把这些高点连成一条线", "language": "zh", "index": 248}, {"start": 882.999, "end": 886.088, "text": "你会看到每次它接近那条线时，就会下跌", "language": "zh", "index": 249}, {"start": 886.088, "end": 889.11, "text": "即使它稍稍超过了那条线，也会下跌 超过了一点点，又跌回去了", "language": "zh", "index": 250}, {"start": 890.05, "end": 893.653, "text": "前期的高点和低点很重要", "language": "zh", "index": 251}, {"start": 893.653, "end": 896.064, "text": "市场处于下降趋势中； 你要寻找做空的机会", "language": "zh", "index": 252}, {"start": 896.064, "end": 900.084, "text": "反弹的时候逢高做空是一个好的选择", "language": "zh", "index": 253}, {"start": 900.084, "end": 902.898, "text": "接近趋势线，并反转向下， 那是一个好的做空入场点", "language": "zh", "index": 254}, {"start": 902.898, "end": 904.552, "text": "接近趋势线，反转向下", "language": "zh", "index": 255}, {"start": 904.552, "end": 909.833, "text": "接近趋势线时，在前一根K线下方挂突破卖单", "language": "zh", "index": 256}, {"start": 910.943, "end": 912.185, "text": "再来看这里", "language": "zh", "index": 257}, {"start": 912.541, "end": 915.447, "text": "每次它接近之前的低点时，就会反弹", "language": "zh", "index": 258}, {"start": 915.948, "end": 918.177, "text": "所以之前的低点有支撑", "language": "zh", "index": 259}, {"start": 918.689, "end": 921.091, "text": "交易者会寻找向上反转的做多机会", "language": "zh", "index": 260}, {"start": 921.389, "end": 925.281, "text": "当价格创新低时，他们会在前一根K线的高点上方", "language": "zh", "index": 261}, {"start": 925.282, "end": 926.963, "text": "挂突破买单", "language": "zh", "index": 262}, {"start": 926.964, "end": 929.268, "text": "我用绿色框框来标记入场点", "language": "zh", "index": 263}, {"start": 935.764, "end": 943.142, "text": "那些在阻力位卖出，在支撑位买入的交易者是价值投资者", "language": "zh", "index": 264}, {"start": 943.638, "end": 947.514, "text": "他们想在便宜时买入，在昂贵时卖出", "language": "zh", "index": 265}, {"start": 950.514, "end": 952.328, "text": "我刚才说有两个力量控制着市场", "language": "zh", "index": 266}, {"start": 952.328, "end": 954.278, "text": "分别是背景和动能", "language": "zh", "index": 267}, {"start": 955.682, "end": 958.111, "text": "动能指的是趋势的强度", "language": "zh", "index": 268}, {"start": 958.111, "end": 962.853, "text": "讲突破的视频课中，我会详细地讲动量", "language": "zh", "index": 269}, {"start": 963.142, "end": 964.165, "text": "看这里", "language": "zh", "index": 270}, {"start": 964.165, "end": 967.672, "text": "很强的下跌，很强的上涨", "language": "zh", "index": 271}, {"start": 970.606, "end": 975.217, "text": "当动能强劲时，交易者们想要沿着动能的方向交易", "language": "zh", "index": 272}, {"start": 975.217, "end": 978.677, "text": "如果下跌的动能很强，交易者们应该做空", "language": "zh", "index": 273}, {"start": 978.678, "end": 982.933, "text": "甚至可以在大阴线的收盘去追空", "language": "zh", "index": 274}, {"start": 982.934, "end": 987.704, "text": "押注任何反弹都不会超过这个高点 然后市场会继续下跌", "language": "zh", "index": 275}, {"start": 988.193, "end": 989.452, "text": "这里也是一样", "language": "zh", "index": 276}, {"start": 989.452, "end": 990.952, "text": "可以在大阳线的收盘追涨", "language": "zh", "index": 277}, {"start": 990.953, "end": 993.699, "text": "因为你知道，它大概率还会至少再涨一点", "language": "zh", "index": 278}, {"start": 993.7, "end": 997.35, "text": "这里尽管有回调，但始终高于上涨趋势的起点", "language": "zh", "index": 279}, {"start": 997.35, "end": 999.732, "text": "然后再次上涨", "language": "zh", "index": 280}, {"start": 999.732, "end": 1002.181, "text": "所以交易者会在反转向上时买入", "language": "zh", "index": 281}, {"start": 1004.464, "end": 1006.822, "text": "所以他们会在突破或回调时买入", "language": "zh", "index": 282}, {"start": 1006.823, "end": 1009.823, "text": "这里，他们会在突破或反弹时卖空", "language": "zh", "index": 283}, {"start": 1009.824, "end": 1011.206, "text": "他们不仅仅在这里卖空", "language": "zh", "index": 284}, {"start": 1011.206, "end": 1012.635, "text": "他们一路卖", "language": "zh", "index": 285}, {"start": 1012.635, "end": 1015.811, "text": "你甚至可以卖在阶段的最低点， 然后依旧赚钱", "language": "zh", "index": 286}, {"start": 1015.812, "end": 1017.125, "text": "这里也是一样", "language": "zh", "index": 287}, {"start": 1017.125, "end": 1019.224, "text": "交易者们不是只在它的收盘买入", "language": "zh", "index": 288}, {"start": 1019.224, "end": 1021.595, "text": "很多人从底部开始，一直在买入", "language": "zh", "index": 289}, {"start": 1021.595, "end": 1024.491, "text": "这就是为什么出现了这个强势突破；大家都在买入", "language": "zh", "index": 290}, {"start": 1028.019, "end": 1028.883, "text": "看这里", "language": "zh", "index": 291}, {"start": 1029.352, "end": 1030.781, "text": "市场失去动能", "language": "zh", "index": 292}, {"start": 1030.781, "end": 1033.509, "text": "有几根阴线，但它们很小，后面跟着一根阳线", "language": "zh", "index": 293}, {"start": 1033.509, "end": 1034.803, "text": "下一根阴线，下影线很长", "language": "zh", "index": 294}, {"start": 1034.803, "end": 1037.673, "text": "小阴线，后面是一根反转的阳线", "language": "zh", "index": 295}, {"start": 1039.266, "end": 1041.452, "text": "向下的动能变弱", "language": "zh", "index": 296}, {"start": 1041.452, "end": 1043.777, "text": "与此相比", "language": "zh", "index": 297}, {"start": 1044.972, "end": 1046.693, "text": "交易者在每个前期低点挂单买入", "language": "zh", "index": 298}, {"start": 1046.976, "end": 1049.867, "text": "而且通过这种做法赚到了钱", "language": "zh", "index": 299}, {"start": 1049.867, "end": 1052.413, "text": "所以他们押注趋势不会再跌太多", "language": "zh", "index": 300}, {"start": 1052.931, "end": 1059.067, "text": "市场正在从强下降趋势 过渡到弱下降趋势", "language": "zh", "index": 301}, {"start": 1059.067, "end": 1061.391, "text": "然后可能是一个震荡区间（有双底）", "language": "zh", "index": 302}, {"start": 1061.391, "end": 1064.125, "text": "甚至反转成为上涨趋势", "language": "zh", "index": 303}, {"start": 1064.652, "end": 1069.652, "text": "所以动能在减弱，交易者们开始寻找做反转的机会", "language": "zh", "index": 304}, {"start": 1070.584, "end": 1072.593, "text": "比如在开始反转向上时买入", "language": "zh", "index": 305}, {"start": 1072.593, "end": 1076.245, "text": "双底，低点降低的大反转模式（LLMTR）", "language": "zh", "index": 306}, {"start": 1076.631, "end": 1079.982, "text": "下降趋势，突破了下降通道线", "language": "zh", "index": 307}, {"start": 1079.982, "end": 1084.366, "text": "然后测试前期的低点", "language": "zh", "index": 308}, {"start": 1084.366, "end": 1087.79, "text": "再次反转向上，第二次和第三次反转向上", "language": "zh", "index": 309}, {"start": 1088.527, "end": 1092.103, "text": "所以这是一笔合理的反转交易", "language": "zh", "index": 310}, {"start": 1094.13, "end": 1097.875, "text": "我非常关注强度转变的信号", "language": "zh", "index": 311}, {"start": 1098.113, "end": 1101.042, "text": "市场处于下降趋势中，但是看这里", "language": "zh", "index": 312}, {"start": 1101.042, "end": 1104.204, "text": "四根连续的阳线，全部收在高位", "language": "zh", "index": 313}, {"start": 1104.204, "end": 1107.815, "text": "其中两根实体部分非常大", "language": "zh", "index": 314}, {"start": 1108.183, "end": 1112.856, "text": "下降趋势，突然的爆发上涨", "language": "zh", "index": 315}, {"start": 1112.856, "end": 1116.009, "text": "这代表多头买入的强度非常大", "language": "zh", "index": 316}, {"start": 1116.009, "end": 1118.331, "text": "交易者称之为买入压力，买压", "language": "zh", "index": 317}, {"start": 1118.627, "end": 1121.241, "text": "所以我会关注买压", "language": "zh", "index": 318}, {"start": 1121.242, "end": 1125.552, "text": "这里，这里，下跌，但又强势地反转向上", "language": "zh", "index": 319}, {"start": 1126.439, "end": 1128.622, "text": "市场变得更加看涨", "language": "zh", "index": 320}, {"start": 1128.622, "end": 1130.468, "text": "这里有非常强的买压", "language": "zh", "index": 321}, {"start": 1131.494, "end": 1133.431, "text": "在下跌过程中，我关注卖出压力，卖压", "language": "zh", "index": 322}, {"start": 1133.431, "end": 1135.277, "text": "连续很多根阴线下跌", "language": "zh", "index": 323}, {"start": 1135.278, "end": 1139.938, "text": "每一根K线的高点都在降低", "language": "zh", "index": 324}, {"start": 1139.938, "end": 1143.565, "text": "低点也在降低，很强势的下跌", "language": "zh", "index": 325}, {"start": 1143.565, "end": 1148.116, "text": "以任何理由做空，因为大概率还会继续下跌", "language": "zh", "index": 326}, {"start": 1150.189, "end": 1153.199, "text": "交易者们关注趋势的强度", "language": "zh", "index": 327}, {"start": 1153.199, "end": 1156.771, "text": "除了风险和回报，盈亏比", "language": "zh", "index": 328}, {"start": 1156.771, "end": 1158.941, "text": "他们需要关注概率", "language": "zh", "index": 329}, {"start": 1158.942, "end": 1161.945, "text": "管理一笔交易，是非常重要的事情", "language": "zh", "index": 330}, {"start": 1161.946, "end": 1165.149, "text": "下单之后，他们必须正确地管理", "language": "zh", "index": 331}, {"start": 1168.299, "end": 1173.827, "text": "想要成为交易员，不能靠蜡烛图形态", "language": "zh", "index": 332}, {"start": 1174.101, "end": 1176.647, "text": "完全没有必要去学它", "language": "zh", "index": 333}, {"start": 1176.648, "end": 1180.906, "text": "也许是大局中的一个有用的小零件", "language": "zh", "index": 334}, {"start": 1180.906, "end": 1182.495, "text": "总之不怎么重要", "language": "zh", "index": 335}, {"start": 1182.495, "end": 1185.576, "text": "很多机构使用线型图交易", "language": "zh", "index": 336}, {"start": 1185.903, "end": 1187.607, "text": "他们根本不看蜡烛图形态", "language": "zh", "index": 337}, {"start": 1187.607, "end": 1190.639, "text": "他们知道趋势的方向，趋势的强度", "language": "zh", "index": 338}, {"start": 1190.639, "end": 1194.25, "text": "支撑和阻力比蜡烛图形态重要得多", "language": "zh", "index": 339}, {"start": 1195.395, "end": 1199.417, "text": "如果你看着这张线型图，", "language": "zh", "index": 340}, {"start": 1199.417, "end": 1202.035, "text": "难道看蜡烛图形态能让趋势更强？", "language": "zh", "index": 341}, {"start": 1202.035, "end": 1204.064, "text": "或者你会说“哇，涨得真快。", "language": "zh", "index": 342}, {"start": 1204.064, "end": 1206.85, "text": "更高的低点，更高的高点—— 我也要买入做多”", "language": "zh", "index": 343}, {"start": 1207.708, "end": 1210.661, "text": "蜡烛图形态不会改变任何东西", "language": "zh", "index": 344}, {"start": 1210.661, "end": 1212.538, "text": "当看到这个，必须得买入", "language": "zh", "index": 345}, {"start": 1212.538, "end": 1214.846, "text": "蜡烛图形态不会提供任何帮助", "language": "zh", "index": 346}, {"start": 1218.205, "end": 1220.725, "text": "接下来，我想说一些关于指标的事情", "language": "zh", "index": 347}, {"start": 1221.846, "end": 1224.85, "text": "当我刚开始交易时，", "language": "zh", "index": 348}, {"start": 1224.85, "end": 1226.628, "text": "所有的杂志都有这种图片", "language": "zh", "index": 349}, {"start": 1227.123, "end": 1231.309, "text": "他们试图在图上添加尽可能多的指标", "language": "zh", "index": 350}, {"start": 1231.31, "end": 1234.152, "text": "让你相信，如果你买他们的软件", "language": "zh", "index": 351}, {"start": 1234.152, "end": 1237.051, "text": "可以创建所有这些指标", "language": "zh", "index": 352}, {"start": 1237.051, "end": 1241.041, "text": "你比其他人就有更多优势 你就可以赚钱", "language": "zh", "index": 353}, {"start": 1242.565, "end": 1244.897, "text": "这些东西真的有帮助吗？", "language": "zh", "index": 354}, {"start": 1245.274, "end": 1248.958, "text": "如果一个指标有用，那么多来几个会更有用吗？", "language": "zh", "index": 355}, {"start": 1248.958, "end": 1250.784, "text": "不如加10个指标，会不会赚更多钱？", "language": "zh", "index": 356}, {"start": 1253.083, "end": 1254.43, "text": "答案是否定的", "language": "zh", "index": 357}, {"start": 1254.43, "end": 1257.021, "text": "事实上，有这么多指标覆盖在图上", "language": "zh", "index": 358}, {"start": 1257.021, "end": 1259.349, "text": "你几乎看不清图上的价格行为", "language": "zh", "index": 359}, {"start": 1259.349, "end": 1263.172, "text": "指标会分散你的注意力", "language": "zh", "index": 360}, {"start": 1263.63, "end": 1265.982, "text": "让你无法关注图表本身", "language": "zh", "index": 361}, {"start": 1267.209, "end": 1269.925, "text": "这是同一张图，移除指标之后的", "language": "zh", "index": 362}, {"start": 1269.926, "end": 1271.641, "text": "我可以看到发生了什么", "language": "zh", "index": 363}, {"start": 1271.641, "end": 1273.447, "text": "多头试图突破", "language": "zh", "index": 364}, {"start": 1273.447, "end": 1275.321, "text": "但是突破失败，大的反转K线向下", "language": "zh", "index": 365}, {"start": 1275.321, "end": 1277.477, "text": "可能会继续下跌，回到区间的底部", "language": "zh", "index": 366}, {"start": 1277.478, "end": 1279.741, "text": "震荡区间的突破经常会失败", "language": "zh", "index": 367}, {"start": 1281.339, "end": 1282.282, "text": "我会在它的下方做空", "language": "zh", "index": 368}, {"start": 1282.845, "end": 1286.619, "text": "三次下跌，震荡区间向下突破失败 ——我在找买入机会", "language": "zh", "index": 369}, {"start": 1291.236, "end": 1294.465, "text": "收敛三角形，突破模式 它是大三角形里面的一个小三角形", "language": "zh", "index": 370}, {"start": 1294.465, "end": 1297.264, "text": "我会在突破的时候做空", "language": "zh", "index": 371}, {"start": 1299.794, "end": 1302.532, "text": "强下降趋势，多头尝试反转", "language": "zh", "index": 372}, {"start": 1302.532, "end": 1304.83, "text": "大概率会失败，所以我会继续做空", "language": "zh", "index": 373}, {"start": 1305.374, "end": 1308.687, "text": "前期的反弹，有可能是末端旗形", "language": "zh", "index": 374}, {"start": 1308.688, "end": 1311.905, "text": "不错的反转信号K线（也是双K反转） 我会买入尝试做反转", "language": "zh", "index": 375}, {"start": 1314.41, "end": 1318.482, "text": "下降趋势的50%反弹，我会找机会做空", "language": "zh", "index": 376}, {"start": 1318.885, "end": 1320.874, "text": "好，第二个做空入场点", "language": "zh", "index": 377}, {"start": 1320.874, "end": 1324.068, "text": "小的双顶，不错的做空机会", "language": "zh", "index": 378}, {"start": 1326.925, "end": 1329.468, "text": "小三角形，多头突破失败", "language": "zh", "index": 379}, {"start": 1329.799, "end": 1332.701, "text": "我会在做空信号K下方开仓做空", "language": "zh", "index": 380}, {"start": 1332.701, "end": 1333.85, "text": "押注价格至少再下跌一点", "language": "zh", "index": 381}, {"start": 1334.662, "end": 1337.287, "text": "低点抬高的大反转模式", "language": "zh", "index": 382}, {"start": 1337.288, "end": 1341.131, "text": "下降趋势，多头突破，低点抬高 而且这一段下跌并不强", "language": "zh", "index": 383}, {"start": 1341.131, "end": 1345.263, "text": "两次下跌，1，回调，2 我会买入做多", "language": "zh", "index": 384}, {"start": 1345.263, "end": 1347.764, "text": "指标并没有显示这些（交易机会）", "language": "zh", "index": 385}, {"start": 1348.541, "end": 1353.691, "text": "对我来说，我个人更喜欢只看K线图", "language": "zh", "index": 386}, {"start": 1353.691, "end": 1358.169, "text": "并试图理解市场在做什么， 然后我根据价格行为下单", "language": "zh", "index": 387}, {"start": 1358.169, "end": 1362.019, "text": "对我来说，我不喜欢指标 因为指标在不断寻找趋势中的反转", "language": "zh", "index": 388}, {"start": 1362.019, "end": 1367.445, "text": "不断寻找震荡区间中的突破 这让我感到很有压力", "language": "zh", "index": 389}, {"start": 1367.445, "end": 1370.129, "text": "这与我应该做事的完全相反", "language": "zh", "index": 390}, {"start": 1371.527, "end": 1373.418, "text": "你经常会看到这样的事情", "language": "zh", "index": 391}, {"start": 1373.419, "end": 1378.709, "text": "看看指标中的这个低点和这个低点", "language": "zh", "index": 392}, {"start": 1378.709, "end": 1382.381, "text": "低点抬高了，这个低点更高", "language": "zh", "index": 393}, {"start": 1382.381, "end": 1384.945, "text": "这被称作背离，这是一个双重背离", "language": "zh", "index": 394}, {"start": 1385.514, "end": 1387.462, "text": "网上的“指标达人”会告诉你：", "language": "zh", "index": 395}, {"start": 1387.462, "end": 1390.06, "text": "双重背离，你应该要买入", "language": "zh", "index": 396}, {"start": 1391.474, "end": 1397.904, "text": "价格创新低了，但是震荡指标在向上", "language": "zh", "index": 397}, {"start": 1397.904, "end": 1399.255, "text": "赶紧买入抄底”", "language": "zh", "index": 398}, {"start": 1399.255, "end": 1401.186, "text": "不。看K线就知道了", "language": "zh", "index": 399}, {"start": 1401.93, "end": 1407.146, "text": "非常窄的下降通道，几乎没有明显的反弹", "language": "zh", "index": 400}, {"start": 1407.146, "end": 1409.529, "text": "做空赚钱要容易得多", "language": "zh", "index": 401}, {"start": 1409.53, "end": 1413.166, "text": "即使指标显示有背离 这里是又有背离", "language": "zh", "index": 402}, {"start": 1414.57, "end": 1417.696, "text": "价格在下跌，指标在上升", "language": "zh", "index": 403}, {"start": 1417.696, "end": 1418.622, "text": "更高的低点", "language": "zh", "index": 404}, {"start": 1419.134, "end": 1422.576, "text": "这太疯狂了，对吧？", "language": "zh", "index": 405}, {"start": 1422.576, "end": 1424.388, "text": "这是新手使用指标时面临的最大问题", "language": "zh", "index": 406}, {"start": 1424.389, "end": 1427.806, "text": "他们看指标或形态", "language": "zh", "index": 407}, {"start": 1427.807, "end": 1429.108, "text": "“哇！指标背离了", "language": "zh", "index": 408}, {"start": 1429.108, "end": 1431.516, "text": "我要买入抄底“ 但他们不看K线图", "language": "zh", "index": 409}, {"start": 1432.078, "end": 1434.727, "text": "当市场处于几乎没有反弹的下降趋势时", "language": "zh", "index": 410}, {"start": 1434.727, "end": 1437.374, "text": "你只能通过做空赚钱，而不是做多", "language": "zh", "index": 411}, {"start": 1440.892, "end": 1444.912, "text": "所以依靠指标，是一个不愿意思考的借口", "language": "zh", "index": 412}, {"start": 1444.912, "end": 1450.891, "text": "在一个强劲的下降趋势中买入—— 它偶尔可以让你赚钱", "language": "zh", "index": 413}, {"start": 1450.892, "end": 1453.062, "text": "因为盈亏比很好", "language": "zh", "index": 414}, {"start": 1453.062, "end": 1455.826, "text": "你在这里买入，你的止损在这里", "language": "zh", "index": 415}, {"start": 1455.827, "end": 1457.52, "text": "风险非常小", "language": "zh", "index": 416}, {"start": 1457.52, "end": 1460.585, "text": "如果反转，一直往上涨 你的利润非常大", "language": "zh", "index": 417}, {"start": 1460.586, "end": 1465.84, "text": "然而，概率是多少？概率非常低", "language": "zh", "index": 418}, {"start": 1465.841, "end": 1468.458, "text": "交易者需要的不仅仅是盈亏比", "language": "zh", "index": 419}, {"start": 1468.459, "end": 1470.465, "text": "电视上的“专家”", "language": "zh", "index": 420}, {"start": 1470.465, "end": 1473.901, "text": "总是谈论小风险，大回报", "language": "zh", "index": 421}, {"start": 1473.901, "end": 1478.319, "text": "从不谈论概率，但那很重要， 是盈亏比的另一面", "language": "zh", "index": 422}, {"start": 1478.32, "end": 1481.979, "text": "如果一笔交易有极好的盈亏比 即小风险，大回报", "language": "zh", "index": 423}, {"start": 1481.979, "end": 1487.195, "text": "那么它的胜率也非常小", "language": "zh", "index": 424}, {"start": 1487.195, "end": 1491.168, "text": "因为必须存在一个理由， 让某些机构去做对手盘", "language": "zh", "index": 425}, {"start": 1491.168, "end": 1495.977, "text": "如果你得到了极好的盈亏比 那么你的对手盘呢？", "language": "zh", "index": 426}, {"start": 1495.977, "end": 1498.637, "text": "他们得到了很高的胜率", "language": "zh", "index": 427}, {"start": 1498.638, "end": 1500.577, "text": "这些机构更有可能赚钱", "language": "zh", "index": 428}, {"start": 1500.577, "end": 1502.837, "text": "逆势抄底，偶尔你会赚很多钱 （前提是能够坚定持有，而不是赚了一点就离场）", "language": "zh", "index": 429}, {"start": 1503.657, "end": 1505.913, "text": "但大多数时候你会亏钱", "language": "zh", "index": 430}, {"start": 1505.914, "end": 1508.211, "text": "然后小的损失不断积累", "language": "zh", "index": 431}, {"start": 1508.212, "end": 1510.001, "text": "指标告诉你：买入", "language": "zh", "index": 432}, {"start": 1510.001, "end": 1511.759, "text": "买，买，买。买，买，买", "language": "zh", "index": 433}, {"start": 1511.759, "end": 1512.668, "text": "你买了，也亏钱了", "language": "zh", "index": 434}, {"start": 1512.668, "end": 1513.495, "text": "你又买了，又亏钱", "language": "zh", "index": 435}, {"start": 1513.495, "end": 1514.781, "text": "继续买，继续亏", "language": "zh", "index": 436}, {"start": 1515.094, "end": 1517.885, "text": "尽管每次亏得不多，因为止损很小 （至于不止损的人......）", "language": "zh", "index": 437}, {"start": 1517.885, "end": 1521.428, "text": "但是水滴石穿", "language": "zh", "index": 438}, {"start": 1521.429, "end": 1524.024, "text": "那些小损失加起来，就是大的亏损", "language": "zh", "index": 439}, {"start": 1527.22, "end": 1528.608, "text": "想成为优秀的交易员，必须要有耐心", "language": "zh", "index": 440}, {"start": 1528.609, "end": 1529.819, "text": "有很多东西要学", "language": "zh", "index": 441}, {"start": 1529.819, "end": 1532.257, "text": "这就是为什么这门课程有这么多视频的原因", "language": "zh", "index": 442}, {"start": 1532.258, "end": 1533.851, "text": "我尝试把成为一名优秀交易员所需要的所有东西", "language": "zh", "index": 443}, {"start": 1533.851, "end": 1537.189, "text": "都教给你", "language": "zh", "index": 444}, {"start": 1537.69, "end": 1539.546, "text": "成功没有捷径", "language": "zh", "index": 445}, {"start": 1539.546, "end": 1541.567, "text": "指标不是捷径", "language": "zh", "index": 446}, {"start": 1541.862, "end": 1544.397, "text": "蜡烛图形态不是捷径", "language": "zh", "index": 447}, {"start": 1544.398, "end": 1548.243, "text": "交易永远不是一件容易的事情", "language": "zh", "index": 448}, {"start": 1548.243, "end": 1552.714, "text": "因为你在与极其聪明、勤奋的人竞争", "language": "zh", "index": 449}, {"start": 1552.714, "end": 1554.854, "text": "他们已经做了多年，他们不想让你赚一分钱", "language": "zh", "index": 450}, {"start": 1554.855, "end": 1557.767, "text": "他们想拿走他们能拿到的每一分钱 那是他们的工作", "language": "zh", "index": 451}, {"start": 1557.767, "end": 1558.622, "text": "那是他们应该做的", "language": "zh", "index": 452}, {"start": 1558.622, "end": 1561.162, "text": "那也是我的工作，那是我每天都在做的", "language": "zh", "index": 453}, {"start": 1561.688, "end": 1565.722, "text": "即使很难，但是我很享受这个挑战", "language": "zh", "index": 454}, {"start": 1567.508, "end": 1570.864, "text": "交易者应该看什么类型的图呢？ 看一下这张图", "language": "zh", "index": 455}, {"start": 1570.864, "end": 1572.516, "text": "是欧元兑日元", "language": "zh", "index": 456}, {"start": 1572.516, "end": 1574.009, "text": "这是月K线", "language": "zh", "index": 457}, {"start": 1574.809, "end": 1578.039, "text": "不看时间坐标的话，是无法分辨的", "language": "zh", "index": 458}, {"start": 1578.039, "end": 1580.321, "text": "它可能是5分钟图", "language": "zh", "index": 459}, {"start": 1580.321, "end": 1582.725, "text": "可能是1分钟图， 也可能是60分钟图", "language": "zh", "index": 460}, {"start": 1582.725, "end": 1583.984, "text": "实际上它是月K线图", "language": "zh", "index": 461}, {"start": 1584.494, "end": 1589.453, "text": "我想说的是，有些交易者不喜欢日内交易", "language": "zh", "index": 462}, {"start": 1589.453, "end": 1592.965, "text": "他们想在日线图，周线图或月线图上交易", "language": "zh", "index": 463}, {"start": 1592.966, "end": 1595.495, "text": "没有任何的区别，过程仍然是相同的", "language": "zh", "index": 464}, {"start": 1595.495, "end": 1597.009, "text": "市场在上涨", "language": "zh", "index": 465}, {"start": 1597.009, "end": 1600.431, "text": "交易者在回调时买入，甚至在突破时买入做多", "language": "zh", "index": 466}, {"start": 1600.431, "end": 1604.249, "text": "如果价格尝试筑顶，反转， 交易者会开始做空", "language": "zh", "index": 467}, {"start": 1604.795, "end": 1606.489, "text": "这个过程是一样的", "language": "zh", "index": 468}, {"start": 1606.489, "end": 1608.757, "text": "时间级别无关紧要", "language": "zh", "index": 469}, {"start": 1608.757, "end": 1610.323, "text": "所有市场都具有分型结构", "language": "zh", "index": 470}, {"start": 1610.882, "end": 1613.746, "text": "更大的形态是由更小的形态组成的", "language": "zh", "index": 471}, {"start": 1613.746, "end": 1616.49, "text": "更小的形态是更大形态的一部分", "language": "zh", "index": 472}, {"start": 1616.49, "end": 1617.93, "text": "都是一样的", "language": "zh", "index": 473}, {"start": 1622.945, "end": 1626.907, "text": "如果你用月K线交易，因为K线非常大", "language": "zh", "index": 474}, {"start": 1626.908, "end": 1629.239, "text": "所以止损非常远", "language": "zh", "index": 475}, {"start": 1629.24, "end": 1633.302, "text": "你必须用非常小的仓位", "language": "zh", "index": 476}, {"start": 1633.302, "end": 1635.799, "text": "来控制你的风险", "language": "zh", "index": 477}, {"start": 1639.694, "end": 1642.17, "text": "在这个视频中，我谈到了蜡烛图形态", "language": "zh", "index": 478}, {"start": 1642.17, "end": 1645.005, "text": "以及为什么它们没用", "language": "zh", "index": 479}, {"start": 1645.006, "end": 1649.222, "text": "我还讨论了真正的职业交易者， 他们会谈论哪些话题", "language": "zh", "index": 480}, {"start": 1649.222, "end": 1653.244, "text": "正如我所说，他们更多地谈论支撑和阻力", "language": "zh", "index": 481}, {"start": 1653.245, "end": 1657.48, "text": "谈论动能和趋势强度，而不是蜡烛图形态", "language": "zh", "index": 482}, {"start": 1657.48, "end": 1660.056, "text": "他们几乎从不谈论蜡烛图形态", "language": "zh", "index": 483}, {"start": 1660.057, "end": 1663.509, "text": "我还谈到了指标，", "language": "zh", "index": 484}, {"start": 1663.509, "end": 1665.555, "text": "以及新手为什么非常容易过度依赖指标", "language": "zh", "index": 485}, {"start": 1665.556, "end": 1667.739, "text": "如果你使用指标，你往往会发现", "language": "zh", "index": 486}, {"start": 1667.739, "end": 1670.619, "text": "它们无法帮助你赚钱", "language": "zh", "index": 487}, {"start": 1670.62, "end": 1673.523, "text": "我不反对使用指标", "language": "zh", "index": 488}, {"start": 1673.523, "end": 1676.29, "text": "前提是你在很开心地赚钱", "language": "zh", "index": 489}, {"start": 1676.756, "end": 1681.082, "text": "但如果你没有赚钱，而且使用指标时感到压力", "language": "zh", "index": 490}, {"start": 1681.082, "end": 1683.762, "text": "我的建议是，摆脱它们，只看价格行为", "language": "zh", "index": 491}, {"start": 1684.168, "end": 1687.692, "text": "如果你看职业交易员做交易", "language": "zh", "index": 492}, {"start": 1687.692, "end": 1689.544, "text": "你很少看到有人在图上放一个指标", "language": "zh", "index": 493}, {"start": 1689.545, "end": 1693.666, "text": "因为绝大多数职业交易员不关注指标", "language": "zh", "index": 494}, {"start": 1693.667, "end": 1695.939, "text": "他们关注价格行为", "language": "zh", "index": 495}, {"start": 1699.773, "end": 1701.167, "text": "我是阿尔·布鲁克斯", "language": "zh", "index": 496}, {"start": 1701.167, "end": 1703.251, "text": "感谢观看布鲁克斯交易课", "language": "zh", "index": 497}, {"start": 1703.251, "end": 1707.673, "text": "图表基础和价格行为的最后一节课， 到这里就讲完了", "language": "zh", "index": 498}], "meta": {"course": "2D", "video": "E:\\涂山量化\\01_数据源\\价格行为\\阿布视频\\2D\\2D.mp4", "video_info": {"width": 1920, "height": 1080, "seconds": 1711.33}, "en_subtitle": "E:\\涂山量化\\01_数据源\\价格行为\\阿布视频\\2D\\2D-en.srt", "cn_subtitle": "E:\\涂山量化\\01_数据源\\价格行为\\阿布视频\\2D\\2D-ch.srt", "subtitle_coverage": {"english": {"available": true, "cues": 498, "start": 1.82, "end": 1707.673, "relative_end_pct": 99.79}, "chinese": {"available": true, "cues": 498, "start": 1.82, "end": 1707.673, "relative_end_pct": 99.79}}, "10fps_scan": {"sampled": 17113, "retained": 3229, "discarded": 13884, "retention_pct": 18.87, "event_ledger": "E:\\涂山量化\\03_回测与研究\\国内期货\\P2701_阿布原课独立系统_20261017\\course_audit\\阿布_统一八步流程_v1\\2D\\all_10fps_detection_events.csv", "seconds_sampled": 1711.3, "detector": "8x6 tiles + global + chroma + adjacent + cumulative", "scan_elapsed_s": 67.91}, "hd_output": {"extracted": 3229, "original_resolution": [1920, 1080], "HD_elapsed_s": 176.44}, "com <script>
const D=JSON.parse(document.getElementById('data').textContent), pageSize=24;
let page=0, frames=D.frames, EN=D.en, ZH=D.zh;
document.getElementById('summary').textContent=frames.length+'张原画质关键帧 | 英文'+EN.length+'条 | 中文'+ZH.length+'条';
const fmt=t=>{let h=Math.floor(t/3600),m=Math.floor(t/60)%60,s=Math.floor(t)%60;
return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':');};
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const matching=(caps,t)=>caps.filter(c=>c.start<=t+6 && c.end>=t-3);
function openAt(t){
 let b=document.getElementById('videoBox');b.style.display='block';
 let v=document.getElementById('video');v.currentTime=t;v.scrollIntoView({behavior:'smooth'});
}
function render(){
 let offset=page*pageSize;
 const chunk=frames.slice(offset,offset+pageSize);
 const grid=document.getElementById('grid');grid.replaceChildren();
 chunk.forEach(f=>{
  const card=document.createElement('article');card.className='item';
  const im=document.createElement('img');im.loading='lazy';im.src=f.image;
  im.alt='第'+f.id+'张 '+fmt(f.t);im.onclick=()=>{
    document.getElementById('full').src=f.image;
    document.getElementById('view').classList.add('active');};
  const area=document.createElement('div');area.className='info';
  const btn=document.createElement('button');btn.textContent='#'+f.id+'  '+fmt(f.t)+' 回看视频';
  btn.onclick=()=>openAt(f.t);area.append(btn);
  let stats=document.createElement('div');stats.className='tiny';
  stats.textContent=f.reason+' | G:'+f.scores.global+' L:'+f.scores.tile+' C:'+f.scores.color;
  area.append(stats);
  for(let [caps,title] of [[EN,'英文讲解'],[ZH,'中文字幕']]){
    let matched=matching(caps,f.t);
    if(matched.length){
      const sect=document.createElement('div');sect.className='spoken';
      const label=document.createElement('strong');label.textContent=title;sect.append(label);
      for(const c of matched){const p=document.createElement('p');p.textContent=fmt(c.start)+' '+c.text;sect.append(p)}
      area.append(sect);
    }
  }
  card.append(im,area);grid.append(card);
 });
 document.getElementById('page').textContent=(page+1)+' / '+Math.ceil(frames.length/pageSize)+' 页';
 for(let id of ['prev','prevBottom'])document.getElementById(id).disabled=page<=0;
 for(let id of ['next','nextBottom'])document.getElementById(id).disabled=(page+1)*pageSize>=frames.length;
 window.scrollTo({top:0,behavior:'instant'});
}
function change(inc){page=Math.max(0,Math.min(Math.ceil(frames.length/pageSize)-1,page+inc));render()}
document.getElementById('prev').onclick=()=>change(-1);
document.getElementById('next').onclick=()=>change(1);
document.getElementById('prevBottom').onclick=()=>change(-1);
document.getElementById('nextBottom').onclick=()=>change(1);
document.getElementById('go').onclick=()=>{
 let target=Number(document.getElementById('jump').value);
 let j=frames.findIndex(f=>f.t>=target);
 if(j<0)j=frames.length-1;page=Math.floor(j/pageSize);render();};
document.getElementById('videoSwitch').onclick=()=>{
let b=document.getElementById('videoBox');b.style.display=b.style.display==='block'?'none':'block';};
document.getElementById('view').onclick=()=>document.getElementById('view').classList.remove('active');
document.getElementById('close').onclick=()=>document.getElementById('view').classList.remove('active');
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('view').classList.remove('active');});
render();
</script></body></html>
